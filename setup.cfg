[metadata]
name = pymodaq_femto
version = file: src/pymodaq_femto/VERSION
description = PyMoDAQ extension for femtosecond laser pulse characterization
long_description = file: README.rst
long_description_content_type = text/x-rst
license = CeCILL-B
licence_file = LICENSE
url = http://pymodaq.cnrs.fr
author = Sébastien Weber
author_email = sebastien.weber@cemes.fr
classifiers =
    Programming Language :: Python :: 3
    Development Status :: 5 - Production/Stable
    Environment :: Other Environment
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Human Machine Interfaces
    Topic :: Scientific/Engineering :: Visualization
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Software Development :: User Interfaces

[options]
py_module = pymodaq_femto
python_requires = >=3.10
install_requires=
    pymodaq_utils==5.2.7
    pymodaq_data==5.2.10
    pymodaq_gui==5.2.9
    numpy
    scipy
    matplotlib
    pypret_pymodaq
    pyqt5

package_dir =
    =src
packages = find:
include_package_data = True

[options.extras_require]
# only needed to launch the retriever as an extension of the PyMoDAQ dashboard
dashboard =
    pymodaq==5.2.11

[options.packages.find]
where = src

[options.entry_points]
pymodaq.extensions =
    femto = pymodaq_femto
console_scripts =
    simulator=pymodaq_femto.simulator:main
    retriever=pymodaq_femto.retriever:main

